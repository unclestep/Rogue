version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  go: '1.25'

output:
  formats:
    text:
      path: stdout
      colors: true
  show-stats: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - copyloopvar
    - wrapcheck
    - revive

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/nikolay/gouge)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
